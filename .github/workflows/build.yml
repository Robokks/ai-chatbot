name: Build

on:
  push:
    branches: [main, 'ccr-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job may write (to publish files).
permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  test-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Signs with the permanent upload key when the ANDROID_* secrets exist
      # (see README); otherwise Gradle falls back to the debug key.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a temporary debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/key.properties
      # One APK per CPU type keeps each download small. The run number makes
      # every build an update of the previous one.
      - run: >-
          flutter build apk --release --split-per-abi
          --target-platform android-arm64,android-x64
          --build-number=${{ github.run_number }}
      - name: Remove signing files
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
      - run: ls -la build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chatbot-android-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-number=${{ github.run_number }}
      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath chatbot-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chatbot-windows-x64
          path: chatbot-windows-x64.zip

  # Publishes the builds to a GitHub Release so they can be downloaded.
  # Branch pushes update the rolling "latest" pre-release; v* tags make a
  # normal release.
  release:
    needs: [test-and-android, windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
      - name: Rename files
        run: |
          mv dist/chatbot-android-apk/app-arm64-v8a-release.apk Chatbot-android.apk
          mv dist/chatbot-android-apk/app-x86_64-release.apk Chatbot-android-x86_64.apk
          mv dist/chatbot-windows-x64/chatbot-windows-x64.zip Chatbot-windows-x64.zip
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Chatbot {0}', github.ref_name) || 'Chatbot (latest build)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
          target_commitish: ${{ github.sha }}
          files: |
            Chatbot-android.apk
            Chatbot-android-x86_64.apk
            Chatbot-windows-x64.zip
          body: |
            Built from ${{ github.sha }}.

            **Android:** download `Chatbot-android.apk` on your phone and open it. Allow
            "Install unknown apps" for your browser when asked. (`Chatbot-android-x86_64.apk`
            is only for emulators and Intel Chromebooks.)

            **Windows:** download `Chatbot-windows-x64.zip`, unzip it, and run
            `ai_chatbot.exe` inside the folder (keep the other files next to it). If
            SmartScreen warns, choose **More info → Run anyway**.

            Then open **Settings → API keys** in the app and add your Claude / ChatGPT /
            DeepSeek key.
