name: Build

on:
  push:
    branches: [main, 'ccr-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  test-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # One APK per CPU type keeps each download small.
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64
      - run: ls -la build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: chatbot-android-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath chatbot-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: chatbot-windows-x64
          path: chatbot-windows-x64.zip

  # Publishes the builds to a GitHub Release so they can be downloaded.
  # Branch pushes update the rolling "latest" pre-release; v* tags make a
  # normal release.
  release:
    needs: [test-and-android, windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Rename files
        run: |
          mv dist/chatbot-android-apk/app-arm64-v8a-release.apk Chatbot-android.apk
          mv dist/chatbot-android-apk/app-x86_64-release.apk Chatbot-android-x86_64.apk
          mv dist/chatbot-windows-x64/chatbot-windows-x64.zip Chatbot-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Chatbot {0}', github.ref_name) || 'Chatbot (latest build)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
          target_commitish: ${{ github.sha }}
          files: |
            Chatbot-android.apk
            Chatbot-android-x86_64.apk
            Chatbot-windows-x64.zip
          body: |
            Built from ${{ github.sha }}.

            **Android:** download `Chatbot-android.apk` on your phone and open it. Allow
            "Install unknown apps" for your browser when asked. (`Chatbot-android-x86_64.apk`
            is only for emulators and Intel Chromebooks.)

            **Windows:** download `Chatbot-windows-x64.zip`, unzip it, and run
            `ai_chatbot.exe` inside the folder (keep the other files next to it). If
            SmartScreen warns, choose **More info → Run anyway**.

            Then open **Settings → API keys** in the app and add your Claude / ChatGPT /
            DeepSeek key.
